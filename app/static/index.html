<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Планувальник Telegram</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐎</text></svg>">
  <link rel="stylesheet" href="/static/styles.css?v=20261027-01">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">🐴</span><span>Telegram<br><small>Планувальник</small></span></div>
    <nav>
      <button class="nav active" data-page="dashboard">▦ <span>Огляд</span></button>
      <button class="nav" data-page="auth">◉ <span>Авторизація</span></button>
      <button class="nav" data-page="chats">◌ <span>Чати</span></button>
      <button class="nav" data-page="pch">① <span>ПЧ</span></button>
      <button class="nav" data-page="pb">② <span>ПБ</span></button>
      <button class="nav" data-page="farm">♨ <span>Ферма</span></button>
      <button class="nav" data-page="ps">⚡ <span>ПС</span></button>
      <button class="nav" data-page="feed">💩 <span>Нагодувати гівном</span></button>
      <button class="nav" data-page="horse-rating">🐎 <span>Horse Rating</span></button>
      <button class="nav" data-page="messages">✉ <span>Повідомлення</span></button>
      <button class="nav" data-page="scheduler">◷ <span>Планувальник</span></button>
      <button class="nav" data-page="logs">≡ <span>Журнал</span></button>
      <button class="nav" data-page="settings">⚙ <span>Налаштування</span></button>
      <button class="nav" data-page="system">⌘ <span>Система</span></button>
    </nav>
    <div class="sidebar-footer"><span class="dot"></span><span id="connection-label">Перевірка…</span></div>
  </aside>
  <main>
    <section class="hero" id="hero-section">
      <div class="hero-grid"></div>
      <div class="hero-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>
      <div class="hero-content">
        <h1 class="hero-title">AutoTelegramHorse</h1>
        <p class="hero-subtitle">Сучасна система автоматизації Telegram з футуристичним дизайном. Ефективне керування розсиланнями, чатами та повідомленнями.</p>
        <div class="hero-cta">
          <button class="button primary" onclick="document.getElementById('hero-section').style.display='none';">
            Перейти до панелі
          </button>
          <button class="button secondary" onclick="setPage('auth')">Підключити Telegram</button>
        </div>
      </div>
    </section>
    <header><button class="menu" id="menu-button" aria-label="Меню">☰</button><div><p class="eyebrow" id="page-kicker">Огляд</p><h1 id="page-title">Панель керування</h1></div><div class="header-actions"><select id="account-select" class="account-select" aria-label="Обліковий запис Telegram"></select><button class="button secondary" id="add-account">+ Обліковий запис</button><button class="icon-button" id="theme-button" title="Змінити тему">☼</button><button class="button secondary" id="global-refresh">Оновити</button></div></header>
    <section id="page-content" class="page-content" aria-live="polite"></section>
  </main>
  <div id="toast-area" class="toast-area" aria-live="polite"></div>
  <dialog id="confirm-dialog" class="modal"></dialog>
  <script src="/static/app.js?v=20261027-01" defer></script>
</body>
</html>
